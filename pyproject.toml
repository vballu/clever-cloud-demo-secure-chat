[project]
name = "clever-cloud-demo-secure-chat"
version = "0.1.0"
description = "Secure chat with Keycloak authentication"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0.0",
    "flask-sqlalchemy>=3.1.0",
    "psycopg2-binary>=2.9.0",
    "python-dotenv>=1.0.0",
    "authlib>=1.3.0",
    "flask-session>=0.8.0",
    "requests>=2.31.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
start = "main:app"

[tool.pytest.ini_options]
pythonpath = ["."]
